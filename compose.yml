# ---------------------------------------------------------------
# 起動:  docker compose up -d --build
# 画面:  http://<このPCまたはNASのIP>:8501
# ---------------------------------------------------------------
name: rag-translation

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: rag-translation-db
    container_name: tm-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: tm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      POSTGRES_DB: tm
    volumes:
      - tm-pgdata:/var/lib/postgresql/data
    # ホストから ingest.py や psql で直接つなぐ場合用（同じPC内からのみ接続可）
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    shm_size: 256mb
    healthcheck:
      # -h localhost で TCP 確認 = 初期化（schema.sql 実行）完了後の本番サーバー起動を待つ
      test: ["CMD-SHELL", "pg_isready -U tm -d tm -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    image: rag-translation-app
    container_name: tm-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TM_DATABASE_URL: postgresql://tm:${POSTGRES_PASSWORD}@db:5432/tm
      # 翻訳機能（.env で設定）
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://192.168.11.83:1234/v1}
      LMSTUDIO_CONCURRENCY: ${LMSTUDIO_CONCURRENCY:-1}
      # 空にすると Ollama を使わない（未設定なら既定の接続先）
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL-http://192.168.11.83:11434}
      OLLAMA_CONCURRENCY: ${OLLAMA_CONCURRENCY:-1}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODELS: ${CLAUDE_MODELS:-claude-haiku-5-5,claude-sonnet-5-5}
      CLAUDE_CONCURRENCY: ${CLAUDE_CONCURRENCY:-4}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODELS: ${OPENAI_MODELS:-gpt-6-luna,gpt-6.1-sol}
      OPENAI_CONCURRENCY: ${OPENAI_CONCURRENCY:-4}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.8-flash}
      GEMINI_CONCURRENCY: ${GEMINI_CONCURRENCY:-4}
      GEMINI_REASONING_EFFORT: ${GEMINI_REASONING_EFFORT:-}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-}
      CLOUD_MAX_TOKENS: ${CLOUD_MAX_TOKENS:-8192}
    ports:
      - "${APP_PORT:-8501}:8501"

volumes:
  tm-pgdata:
