[project]
name = "rag-translation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "k-solhead", email = "hyodo.ka@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "torchvision>=0.29.1",
]

[project.scripts]
rag-translation = "rag_translation:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
